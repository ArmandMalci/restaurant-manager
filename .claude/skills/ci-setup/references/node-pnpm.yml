# ci-setup base gate — Node/pnpm
# Generated by the ci-setup skill. Action majors pinned as of authoring; check each action's
# releases page for its current major before reusing this on a new repo.
# The lint job below carries a why-comment on every setup step (checkout/pnpm-setup/node-setup);
# later jobs reuse those identical steps uncommented and add only a job-level + final-step why.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # why: a new push on the same PR makes the previous run's result moot

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # why: checks out the PR's actual commit, not a stale mirror
      - uses: pnpm/action-setup@v4 # why: installs the pnpm binary before setup-node's cache needs it
        with:
          version: 9
      - uses: actions/setup-node@v4 # why: node runtime + native pnpm store cache keyed on the lockfile
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile # why: fails if the lockfile is out of sync with package.json
      - run: pnpm lint

  typecheck:
    name: Typecheck # why: catches type errors the linter doesn't check for
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit # why: type errors are cheaper to catch here than after merge

  test:
    name: Test # why: the base gate's last line of defense — catches behavior lint/typecheck can't
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run # why: forces vitest out of watch mode so the job actually exits

