# ci-setup base gate — Python/uv
# Generated by the ci-setup skill. Action majors pinned as of authoring; check each action's
# releases page for its current major before reusing this on a new repo.
# The lint job below carries a why-comment on every setup step (checkout/setup-uv/sync); later
# jobs reuse those identical steps uncommented and add only a job-level + final-step why.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # why: a new push on the same PR makes the previous run's result moot

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # why: checks out the PR's actual commit, not a stale mirror
      - uses: astral-sh/setup-uv@v3 # why: installs uv and caches the resolved venv keyed on uv.lock
        with:
          enable-cache: true
      - run: uv sync --frozen # why: fails if uv.lock is out of sync with pyproject.toml
      - run: uv run ruff check .

  typecheck:
    name: Typecheck # why: catches type errors the linter doesn't check for
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy . # why: strict-mode type errors are cheaper to catch here than in prod

  test:
    name: Test # why: the base gate's last line of defense — catches behavior lint/typecheck can't
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest # why: exercises actual runtime behavior, not just static checks
